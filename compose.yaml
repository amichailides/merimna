services:
  postgres:
    image: postgres:17
    container_name: merimna-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merimna}
      POSTGRES_USER: ${DB_USERNAME:-merimna_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-merimna_pass}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - merimna-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-merimna_user} -d ${POSTGRES_DB:-merimna}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merimna-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/merimna}
      DB_USERNAME: ${DB_USERNAME:-merimna_user}
      DB_PASSWORD: ${DB_PASSWORD:-merimna_pass}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyfordevonlydonotuseinproduction}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  merimna-postgres-data: