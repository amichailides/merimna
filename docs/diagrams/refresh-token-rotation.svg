<svg width="680" height="468" viewBox="0 0 680 468" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <title>Refresh token rotation and reuse detection</title>
    <desc>
        A refresh request is validated against the stored token hash. If the token was already rotated,
        reuse is detected and all active refresh tokens for the user are revoked. If the token is valid,
        it is rotated and a new access and refresh token pair is issued.
    </desc>

    <rect x="0" y="0" width="680" height="468" rx="14" fill="#161618"/>

    <defs>
        <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
        >
            <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#5a5a5f"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            />
        </marker>
    </defs>

    <!-- Connectors -->
    <line
            x1="340"
            y1="84"
            x2="340"
            y2="140"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <path
            d="M340 196 L340 230 L195 230 L195 260"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <path
            d="M340 196 L340 230 L485 230 L485 260"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <line
            x1="195"
            y1="316"
            x2="195"
            y2="372"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <line
            x1="485"
            y1="316"
            x2="485"
            y2="372"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />

    <!-- Refresh request -->
    <rect
            x="250"
            y="40"
            width="180"
            height="44"
            rx="8"
            fill="#232326"
            stroke="#4b4b50"
            stroke-width="1"
    />
    <text
            x="340"
            y="62"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffffff"
    >
        Refresh request
    </text>

    <!-- Validate refresh token -->
    <rect
            x="215"
            y="140"
            width="250"
            height="56"
            rx="8"
            fill="#0f3d33"
            stroke="#2fae86"
            stroke-width="1"
    />
    <text
            x="340"
            y="158"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#d7f5ea"
    >
        Validate refresh token
    </text>
    <text
            x="340"
            y="176"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#7fd6b8"
    >
        Lookup stored token hash
    </text>

    <!-- Reuse detected -->
    <rect
            x="80"
            y="260"
            width="230"
            height="56"
            rx="8"
            fill="#4a1414"
            stroke="#e05a5a"
            stroke-width="1"
    />
    <text
            x="195"
            y="278"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffd9d9"
    >
        Reuse detected
    </text>
    <text
            x="195"
            y="296"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#e88f8f"
    >
        Token already rotated
    </text>

    <!-- Token valid -->
    <rect
            x="370"
            y="260"
            width="230"
            height="56"
            rx="8"
            fill="#0f3d33"
            stroke="#2fae86"
            stroke-width="1"
    />
    <text
            x="485"
            y="278"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#d7f5ea"
    >
        Token valid
    </text>
    <text
            x="485"
            y="296"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#7fd6b8"
    >
        Eligible for rotation
    </text>

    <!-- Revoke all refresh tokens -->
    <rect
            x="70"
            y="372"
            width="250"
            height="56"
            rx="8"
            fill="#4a1414"
            stroke="#e05a5a"
            stroke-width="1"
    />
    <text
            x="195"
            y="390"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffd9d9"
    >
        Revoke all refresh tokens
    </text>
    <text
            x="195"
            y="408"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#e88f8f"
    >
        Block further token renewal
    </text>

    <!-- Rotate refresh token -->
    <rect
            x="360"
            y="372"
            width="250"
            height="56"
            rx="8"
            fill="#0f3d33"
            stroke="#2fae86"
            stroke-width="1"
    />
    <text
            x="485"
            y="390"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#d7f5ea"
    >
        Rotate refresh token
    </text>
    <text
            x="485"
            y="408"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#7fd6b8"
    >
        Issue new token pair
    </text>
</svg>