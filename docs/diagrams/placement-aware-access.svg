<svg width="680" height="468" viewBox="0 0 680 468" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <title>Placement-aware access resolution</title>
    <desc>
        An employee's access to beneficiary records is resolved by combining their official assignment
        to a house unit with any active temporary placement to another house unit.
    </desc>

    <rect x="0" y="0" width="680" height="468" rx="14" fill="#161618"/>

    <defs>
        <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
        >
            <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#5a5a5f"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            />
        </marker>
    </defs>

    <!-- Connectors -->
    <path
            d="M340 84 L340 112 L195 112 L195 140"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <path
            d="M340 84 L340 112 L485 112 L485 140"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <path
            d="M195 196 L195 230 L340 230 L340 260"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <path
            d="M485 196 L485 230 L340 230 L340 260"
            fill="none"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />
    <line
            x1="340"
            y1="316"
            x2="340"
            y2="372"
            stroke="#5a5a5f"
            stroke-width="1"
            marker-end="url(#arrow)"
    />

    <!-- Employee -->
    <rect
            x="260"
            y="40"
            width="160"
            height="44"
            rx="8"
            fill="#232326"
            stroke="#4b4b50"
            stroke-width="1"
    />
    <text
            x="340"
            y="62"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffffff"
    >
        Employee
    </text>

    <!-- Official assignment -->
    <rect
            x="80"
            y="140"
            width="230"
            height="56"
            rx="8"
            fill="#0f3d33"
            stroke="#2fae86"
            stroke-width="1"
    />
    <text
            x="195"
            y="158"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#d7f5ea"
    >
        Official assignment
    </text>
    <text
            x="195"
            y="176"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#7fd6b8"
    >
        House unit A
    </text>

    <!-- Active placement -->
    <rect
            x="370"
            y="140"
            width="230"
            height="56"
            rx="8"
            fill="#4a3410"
            stroke="#e0932e"
            stroke-width="1"
    />
    <text
            x="485"
            y="158"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffe8c2"
    >
        Active placement
    </text>
    <text
            x="485"
            y="176"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#e0ac5f"
    >
        House unit B, temporary
    </text>

    <!-- Access scope resolver -->
    <rect
            x="215"
            y="260"
            width="250"
            height="56"
            rx="8"
            fill="#0f3d33"
            stroke="#2fae86"
            stroke-width="1"
    />
    <text
            x="340"
            y="278"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#d7f5ea"
    >
        Access scope resolver
    </text>
    <text
            x="340"
            y="296"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#7fd6b8"
    >
        Combined accessible house units
    </text>

    <!-- Accessible beneficiary records -->
    <rect
            x="210"
            y="372"
            width="260"
            height="56"
            rx="8"
            fill="#232326"
            stroke="#4b4b50"
            stroke-width="1"
    />
    <text
            x="340"
            y="390"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="14"
            font-weight="600"
            fill="#ffffff"
    >
        Accessible beneficiary records
    </text>
    <text
            x="340"
            y="408"
            text-anchor="middle"
            dominant-baseline="central"
            font-size="12"
            fill="#a3a3a3"
    >
        From resolved house units
    </text>
</svg>