# src/main/resources/ValidationMessages.properties

# =================================================================
# VALIDATION MESSAGES NAMING CONVENTION
# =================================================================
# Used ONLY by Bean Validation annotations (@NotNull, @Size, etc.)
#
# Format rules:
#
# 1. Entity-specific validation:
#    <entity>.<field>.<rule>
#    e.g. allergy.substance.required
#         medication.dosage.size
#         emergency.firstName.invalid
#
# 2. Generic/reusable validation (κοινά πεδία σε πολλά entities):
#    <field>.<rule>
#    e.g. firstName.required
#         email.invalid
#         landline.invalid
#
# Notes:
# - Use lowercase and dot-separated keys.
# - All messages end with a period (.).
# - Keep keys stable; rename/refactor them only in dedicated commits.
# =================================================================


