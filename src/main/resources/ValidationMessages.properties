email.invalid=Η διεύθυνση email δεν είναι έγκυρη.
email.required=Το email είναι υποχρεωτικό πεδίο.
contact.missing=Πρέπει να καταχωρήσετε τουλάχιστον ένα τηλέφωνο επικοινωνίας (σταθερό ή κινητό).
afm.required=Το ΑΦΜ είναι υποχρεωτικό πεδίο.
