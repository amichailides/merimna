# =================================================================
# MESSAGE KEYS NAMING CONVENTION
# =================================================================
# Format rules:
#
# 1. Error messages:
#    error.<entity>.<reason>
#    e.g. error.beneficiary.notFoundById
#         error.medication.notOwnedByBeneficiary
#
# 2. Validation messages:
#    validation.<entity>.<field>.<rule>
#    e.g. validation.beneficiary.amka.invalidFormat
#         validation.beneficiary.dateOfBirth.required
#
#    Validation messages are typically stored in ValidationMessages.properties
#    and used by Bean Validation annotations.
#
# 3. Success messages are NOT returned by the REST API.
#    HTTP 2xx status codes indicate success.
#
# Notes:
# - Use lowercase and dot-separated keys.
# - Avoid embedding technical details in the key.
# - Keep keys stable; refactor only in dedicated commits.
# =================================================================


# =================================================================
# GENERIC ERRORS
# =================================================================
error.invalid.input=Μη έγκυρη μορφή δεδομένων στο αίτημα.
error.domain.rule.violation=Παρουσιάστηκαν σφάλματα κατά τον έλεγχο επιχειρησιακών κανόνων.
error.database.conflict=Παρουσιάστηκε σφάλμα κατά την αποθήκευση. Τα δεδομένα που δώσατε φαίνεται να υπάρχουν ήδη ή παραβιάζουν τους κανόνες του συστήματος.
error.internal.server=Παρουσιάστηκε ένα απρόβλεπτο σφάλμα στο σύστημα. Παρακαλώ δοκιμάστε ξανά αργότερα ή επικοινωνήστε με την υποστήριξη.
error.request.parameter.typeMismatch=Η τιμή '{0}' δεν είναι έγκυρη για την παράμετρο '{1}'.

# =================================================================
# GENERIC VALIDATION
# =================================================================
validation.failed=Παρουσιάστηκαν σφάλματα κατά την επικύρωση των στοιχείων.

