error.internal.server=Παρουσιάστηκε ένα απρόβλεπτο σφάλμα στο σύστημα. Παρακαλώ δοκιμάστε ξανά αργότερα ή επικοινωνήστε με την υποστήριξη.
error.request.parameter.typeMismatch=Η τιμή '{0}' δεν είναι έγκυρη για την παράμετρο '{1}'.
error.request.parameter.typeMismatchEnum=Η τιμή ''{0}'' δεν είναι έγκυρη για την παράμετρο ''{1}''. Έγκυρες τιμές\: {2}.
