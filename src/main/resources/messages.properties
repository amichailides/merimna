# =================================================================
# MESSAGE KEYS NAMING CONVENTION
# =================================================================
# Format rules:
#
# 1. Error messages:
#    error.<entity>.<reason>
#    e.g. error.beneficiary.notFoundById
#         error.medication.notOwnedByBeneficiary
#
# 2. Validation messages:
#    validation.<entity>.<field>.<rule>
#    e.g. validation.beneficiary.amka.invalidFormat
#         validation.beneficiary.dateOfBirth.required
#
#    Validation messages are typically stored in ValidationMessages.properties
#    and used by Bean Validation annotations.
#
# 3. Success messages are NOT returned by the REST API.
#    HTTP 2xx status codes indicate success.
#
# Notes:
# - Use lowercase and dot-separated keys.
# - Avoid embedding technical details in the key.
# - Keep keys stable; refactor only in dedicated commits.
# =================================================================


