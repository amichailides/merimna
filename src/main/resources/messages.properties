# =================================================================
# MESSAGE KEYS NAMING CONVENTION
# =================================================================
# Format rules:
#
# 1. Error messages:
#    error.<entity>.<reason>
#    e.g. error.beneficiary.notFoundById
#         error.medication.notOwnedByBeneficiary
#
# 2. Validation messages:
#    validation.<entity>.<field>.<rule>
#    e.g. validation.beneficiary.amka.invalidFormat
#         validation.beneficiary.dateOfBirth.required
#
#    Validation messages are typically stored in ValidationMessages.properties
#    and used by Bean Validation annotations.
#
# 3. Success messages are NOT returned by the REST API.
#    HTTP 2xx status codes indicate success.
#
# Notes:
# - Use lowercase and dot-separated keys.
# - Avoid embedding technical details in the key.
# - Keep keys stable; refactor only in dedicated commits.
# =================================================================


# =================================================================
# GENERIC ERRORS
# =================================================================
error.invalid.input=Invalid data format in the request.
error.domain.rule.violation=Business rule validation errors occurred.
error.database.conflict=An error occurred while saving. The data you provided appears to already exist or violates system rules.
error.internal.server=An unexpected system error occurred. Please try again later or contact support.
error.request.parameter.invalidUuid=The value is not a valid UUID.
error.request.parameter.typeMismatchEnum=The value is not acceptable for this field.
error.request.parameter.typeMismatch=The value has an invalid type.
error.resource.conflict=The action cannot be completed because it conflicts with existing data.
error.resource.notFound=The requested resource does not exist.

# =================================================================
# GENERIC VALIDATION
# =================================================================
validation.failed=Validation errors occurred while checking the submitted data.

